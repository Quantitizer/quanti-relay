[project]
name = "quanti-relay"
version = "0.0.1"
description = "Self-hosted signal-to-trade relay: JSON signals in, risk rails, exchange orders out."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "websockets>=12,<14",  # legacy client API (ws.open) — the private WS relies on it
    "loguru>=0.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
hyperliquid = ["hyperliquid-python-sdk>=0.24"]
# Exchanges beyond Bybit (relay.venue.ccxt_venue): pip install "quanti-relay[venues]"
venues = ["ccxt>=4.5.89,<4.6"]

[project.scripts]
relay = "relay.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "ccxt==4.5.89",           # pinned: a release at least two weeks old
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # SQLite can't reflect the expression index on positions; the baseline creates it by hand.
    "ignore:.*expression-based index:UserWarning",
    "ignore:Skipped unsupported reflection of expression-based index",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ruff's default rule set, minus two patterns the relay uses on purpose:
#   BLE001  background loops and venue calls catch broad exceptions so one failure never stops
#           the relay; every such handler logs (silent `except: pass` stays an error, S110).
#   TRY002  venue errors are raised as plain Exception carrying the venue's code in the message,
#           which callers match on.
ignore = ["BLE001", "TRY002"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on broad failures and stub out code paths on purpose.
"tests/*" = ["B017", "S110", "RUF059"]
# NOT WIRED YET modules: reviewed and fixed when connected (see each module's docstring).
"relay/venue/hyperliquid_adapter.py" = ["S110"]
"relay/execution/keyed_book_importer.py" = ["F841"]
