[[package]]
name = "quanti-relay"
version = "0.1.2"
source = { editable = "." }
dependencies = [
    { name = "aiosqlite" },
    { name = "alembic" },
    { name = "fastapi" },
    { name = "httpx" },
    { name = "loguru" },
    { name = "pydantic" },
    { name = "pydantic-settings" },
    { name = "pyyaml" },
    { name = "sqlalchemy", extra = ["asyncio"] },
    { name = "uvicorn", extra = ["standard"] },
    { name = "websockets" },
]

[package.optional-dependencies]
hyperliquid = [
    { name = "hyperliquid-python-sdk" },
]
postgres = [
    { name = "asyncpg" },
]
venues = [
    { name = "ccxt" },
]

[package.dev-dependencies]
dev = [
    { name = "ccxt" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "aiosqlite", specifier = ">=0.20" },
    { name = "alembic", specifier = ">=1.13" },
    { name = "asyncpg", marker = "extra == 'postgres'", specifier = ">=0.29" },
    { name = "ccxt", marker = "extra == 'venues'", specifier = ">=4.5.89,<4.6" },
    { name = "fastapi", specifier = ">=0.115" },
    { name = "httpx", specifier = ">=0.27" },
    { name = "hyperliquid-python-sdk", marker = "extra == 'hyperliquid'", specifier = ">=0.24" },
    { name = "loguru", specifier = ">=0.7" },
    { name = "pydantic", specifier = ">=2.7" },
    { name = "pydantic-settings", specifier = ">=2.3" },
    { name = "pyyaml", specifier = ">=6" },
    { name = "sqlalchemy", extras = ["asyncio"], specifier = ">=2.0.30" },
    { name = "uvicorn", extras = ["standard"], specifier = ">=0.30" },
    { name = "websockets", specifier = ">=12,<14" },
